# Static export of `dta-app` → GitHub Pages (https://<owner>.github.io/<repo>/).
#
# The deploy job uses environment `dta-static-pages` (not `github-pages`). GitHub’s
# default `github-pages` environment often only allows the default branch (`main`),
# which blocks deploy-pages when this workflow runs from branch `github-pages`.
#
# --- Other checks ---
# 1) Repo Settings → Pages → Build and deployment → Source = "GitHub Actions"
#    (not "Deploy from a branch").
# 2) First run: approve the `dta-static-pages` environment if GitHub prompts.
# 3) Static export has no /api routes — contact booking is email-only on Pages.

name: Deploy to GitHub Pages

on:
  push:
    branches: [github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dta-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dta-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dta-app

      - name: Drop App Router API routes
        run: rm -rf src/app/api
        working-directory: dta-app

      - name: Clean Next build cache
        run: rm -rf .next
        working-directory: dta-app

      - name: Static export
        run: npm run build
        working-directory: dta-app
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Verify static output
        run: test -f index.html && test -d _next
        working-directory: dta-app/out

      - name: Disable Jekyll on GitHub Pages
        run: touch .nojekyll
        working-directory: dta-app/out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dta-app/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: dta-static-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
